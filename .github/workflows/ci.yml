name: Build and test
on:
  push:
    branches: [main, feat/multiplayer-checkers]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://crown:crown_dev@localhost:5432/crown?schema=public
      JWT_SECRET: ci-only-placeholder-secret-that-is-over-32-chars
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm test
      - run: npm run build
